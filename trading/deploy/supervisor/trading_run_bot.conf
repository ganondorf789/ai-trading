#sudo cp /www/ai-trading/trading/deploy/supervisor/trading_run_bot.conf /etc/supervisord.d/trading_run_bot.ini
[program:trading_run_bot]
; 仓位级别跟单机器人 Supervisor 配置
; 通过 gRPC 服务访问数据库和 Redis，跟单特定交易员的特定仓位

; 命令 - 使用 conda ai-trading 环境
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/trading/run_bot.py
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

; 停止配置
stopwaitsecs=30
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_trading_run_bot.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/ai-trading/logs/supervisor_trading_run_bot_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 优先级 (数字越小越先启动，跟单服务在 API 之后启动)
priority=105
