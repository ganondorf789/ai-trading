#sudo cp /www/ai-trading/trading/deploy/supervisor/trading_app.conf /etc/supervisord.d/trading_app.ini
[program:trading_app]
; Trading API Server Supervisor 配置
; 独立的交易服务，提供交易操作和日志查询 API（端口 5001）

; 命令 - 使用 conda ai-trading 环境
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/trading/app.py
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1",API_DEBUG="false"

; 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

; 停止配置
stopwaitsecs=30
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_trading_app.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/ai-trading/logs/supervisor_trading_app_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 优先级 (数字越小越先启动，Trading API 在主 API 之后启动)
priority=95
