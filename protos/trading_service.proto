syntax = "proto3";

package trading;

option go_package = "trading/pb";

// ============================================
// 认证服务 - API Key 验证
// ============================================

service AuthService {
    // 验证 API Key，返回关联的用户信息
    rpc VerifyApiKey(VerifyApiKeyRequest) returns (VerifyApiKeyResponse);
}

// ============================================
// 数据库服务 - 仓位跟单相关操作
// ============================================

service DatabaseService {
    // 获取单个仓位跟单详情
    rpc GetPositionTracking(GetPositionTrackingRequest) returns (PositionTrackingResponse);
    
    // 获取所有活跃的仓位跟单
    rpc GetActivePositionTrackings(GetActivePositionTrackingsRequest) returns (PositionTrackingListResponse);
    
    // 保存仓位跟单记录
    rpc SavePositionTracking(SavePositionTrackingRequest) returns (SavePositionTrackingResponse);
    
    // 更新跟单状态
    rpc UpdateTrackingStatus(UpdateTrackingStatusRequest) returns (UpdateTrackingResponse);
    
    // 更新跟单仓位信息
    rpc UpdateTrackingPosition(UpdateTrackingPositionRequest) returns (UpdateTrackingResponse);
    
    // 获取启用的跟单地址配置
    rpc GetEnabledCopyAddresses(GetEnabledCopyAddressesRequest) returns (CopyAddressListResponse);
    
    // 检查仓位跟单是否存在
    rpc CheckPositionTrackingExists(CheckPositionTrackingExistsRequest) returns (CheckPositionTrackingExistsResponse);
    
    // 启用/禁用跟单地址
    rpc ToggleCopyTradingAddress(ToggleCopyTradingAddressRequest) returns (UpdateTrackingResponse);
}

// ============================================
// Redis服务 - Pub/Sub和缓存操作
// ============================================

service RedisService {
    // 发布消息到指定channel
    rpc Publish(PublishRequest) returns (PublishResponse);
    
    // 订阅channel（服务端流）
    rpc Subscribe(SubscribeRequest) returns (stream SubscribeMessage);
    
    // 设置带过期时间的键值
    rpc SetEx(SetExRequest) returns (SetExResponse);
    
    // 获取键值
    rpc Get(GetRequest) returns (GetResponse);
}

// ============================================
// 数据库服务消息定义
// ============================================

message GetPositionTrackingRequest {
    string tracking_id = 1;  // ULID
}

message GetActivePositionTrackingsRequest {
    // 空请求，获取所有活跃跟单
}

message SavePositionTrackingRequest {
    optional string id = 1;  // ULID
    string target_address = 2;
    string symbol = 3;
    string target_side = 4;
    double copy_ratio = 5;
    optional double max_position_size = 6;
    optional double slippage = 7;
    bool is_enabled = 8;
    string status = 9;
    optional double my_size = 10;
    optional string my_side = 11;
    optional double my_entry_price = 12;
    optional string user_id = 13;  // ULID
    optional string address_id = 14;  // ULID
    optional double target_entry_price = 15;
    optional double target_size = 16;
    optional string nickname = 17;
    
    // 自动补仓配置
    optional bool auto_replenish = 18;           // 是否开启自动补仓
    optional double replenish_ratio = 19;        // 补仓比例
    optional double replenish_min_value_usd = 20; // 最小补仓金额
    optional double replenish_max_value_usd = 21; // 最大补仓金额
    
    // 其他配置
    optional string target_name = 22;            // 目标交易员名称
    optional double min_position_size = 23;      // 最小仓位
    optional bool copy_leverage = 24;            // 是否跟单杠杆
    optional int32 max_leverage = 25;            // 最大杠杆
    optional int32 default_leverage = 26;        // 默认杠杆
    
    // 目标初始仓位快照
    optional double target_initial_size = 27;
    optional string target_initial_side = 28;
    optional double target_initial_entry_price = 29;
    optional int32 target_initial_leverage = 30;
    
    // 时间戳
    optional string started_at = 31;
    optional string closed_at = 32;
    
    // 标记
    optional bool target_is_starred = 33;
    
    // 交易员评分信息
    optional double target_score = 34;
    optional string target_rating = 35;
}

message PositionTrackingResponse {
    bool success = 1;
    optional PositionTracking tracking = 2;
    string error = 3;
}

message PositionTrackingListResponse {
    bool success = 1;
    repeated PositionTracking trackings = 2;
    string error = 3;
}

message PositionTracking {
    string id = 1;  // ULID
    string target_address = 2;
    string symbol = 3;
    string target_side = 4;
    double copy_ratio = 5;
    double max_position_size = 6;
    double slippage = 7;
    bool is_enabled = 8;
    string status = 9;
    double my_size = 10;
    string my_side = 11;
    double my_entry_price = 12;
    string user_id = 13;  // ULID
    string address_id = 14;  // ULID
    double target_entry_price = 15;
    double target_size = 16;
    string nickname = 17;
    string created_at = 18;
    string updated_at = 19;
    string close_reason = 20;
    double closed_pnl = 21;
    
    // 自动补仓配置
    bool auto_replenish = 22;              // 是否开启自动补仓
    double replenish_ratio = 23;           // 补仓比例
    double replenish_min_value_usd = 24;   // 最小补仓金额
    double replenish_max_value_usd = 25;   // 最大补仓金额
    
    // 其他配置
    string target_name = 26;               // 目标交易员名称
    double min_position_size = 27;         // 最小仓位
    bool copy_leverage = 28;               // 是否跟单杠杆
    int32 max_leverage = 29;               // 最大杠杆
    int32 default_leverage = 30;           // 默认杠杆
    
    // 目标初始仓位快照
    double target_initial_size = 31;
    string target_initial_side = 32;
    double target_initial_entry_price = 33;
    int32 target_initial_leverage = 34;
    
    // 时间戳
    string started_at = 35;
    string closed_at = 36;
    
    // 标记
    bool target_is_starred = 37;
    
    // 交易员评分信息
    double target_score = 38;
    string target_rating = 39;
}

message SavePositionTrackingResponse {
    bool success = 1;
    string tracking_id = 2;  // ULID
    string error = 3;
}

message UpdateTrackingStatusRequest {
    string tracking_id = 1;  // ULID
    string status = 2;
    optional string close_reason = 3;
    optional double closed_pnl = 4;
}

message UpdateTrackingPositionRequest {
    string tracking_id = 1;  // ULID
    double my_size = 2;
    string my_side = 3;
    optional double my_entry_price = 4;
}

message UpdateTrackingResponse {
    bool success = 1;
    string error = 2;
}

message GetEnabledCopyAddressesRequest {
    string user_id = 1;  // ULID
}

message CopyAddressListResponse {
    bool success = 1;
    repeated CopyAddress addresses = 2;
    string error = 3;
}

message CopyAddress {
    string id = 1;  // ULID
    string user_id = 2;  // ULID
    string address = 3;
    string nickname = 4;
    double copy_ratio = 5;
    double max_position_size = 6;
    double slippage = 7;
    bool is_enabled = 8;
    bool auto_copy = 9;
    string whitelist_symbols = 10;  // JSON array string
    string blacklist_symbols = 11;  // JSON array string
    string created_at = 12;
    string updated_at = 13;
    bool copy_once = 14;
}

message ToggleCopyTradingAddressRequest {
    string user_id = 1;  // ULID
    string address = 2;
    bool is_enabled = 3;
}

message CheckPositionTrackingExistsRequest {
    string target_address = 1;
    string symbol = 2;
}

message CheckPositionTrackingExistsResponse {
    bool exists = 1;
    string error = 2;
}

// ============================================
// Redis服务消息定义
// ============================================

message PublishRequest {
    string channel = 1;
    string message = 2;
}

message PublishResponse {
    bool success = 1;
    int64 receivers = 2;
    string error = 3;
}

message SubscribeRequest {
    repeated string channels = 1;
}

message SubscribeMessage {
    string channel = 1;
    string message = 2;
}

message SetExRequest {
    string key = 1;
    string value = 2;
    int32 expire_seconds = 3;
}

message SetExResponse {
    bool success = 1;
    string error = 2;
}

message GetRequest {
    string key = 1;
}

message GetResponse {
    bool success = 1;
    optional string value = 2;
    string error = 3;
}

// ============================================
// 认证服务消息定义
// ============================================

message VerifyApiKeyRequest {
    string api_key = 1;
}

message VerifyApiKeyResponse {
    bool valid = 1;
    string user_id = 2;  // ULID
    string account = 3;
    string role = 4;
    string error = 5;
}
