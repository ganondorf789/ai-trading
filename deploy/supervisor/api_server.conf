#sudo cp /www/ai-trading/deploy/supervisor/api_server.conf /etc/supervisord.d/api_server.ini
[program:api_server]
; API 服务器 Supervisor 配置

; 命令 - 使用 conda base 环境
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/api_server.py
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

; 停止配置
stopwaitsecs=30
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_api_server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/ai-trading/logs/supervisor_api_server_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 优先级 (数字越小越先启动，API服务优先启动)
priority=90
