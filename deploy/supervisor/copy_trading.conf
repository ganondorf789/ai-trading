#sudo cp /root/ai-trading/deploy/supervisor/copy_trading.conf /etc/supervisord.d/copy_trading.ini
[program:copy_trading]
; 跟单机器人 Supervisor 配置

; 命令 - 请根据实际路径修改
command=python3 /root/ai-trading/examples/copy_trading_example.py
directory=/root/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

; 停止配置
stopwaitsecs=30
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/root/ai-trading/logs/supervisor_copy_trading.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/root/ai-trading/logs/supervisor_copy_trading_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 优先级 (数字越小越先启动)
priority=100
