#sudo cp /www/ai-trading/deploy/supervisor/refresh_stale_traders.conf /etc/supervisord.d/refresh_stale_traders.ini
[program:refresh_stale_traders]
; 交易者过期数据刷新 Supervisor 配置
; 刷新数据库中分析时间超过指定小时数的交易者数据

; 命令 - 使用 conda ai-trading 环境
; 参数说明: --hours 过期小时数, --rating 最低评级, --workers 并发数, --proxy 启用代理, --delay API延迟
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/refresh_stale_traders.py --workers 10 --proxy
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=false
autorestart=false
startsecs=30
startretries=1

; 停止配置
stopwaitsecs=60
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_refresh_stale_traders.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/www/ai-trading/logs/supervisor_refresh_stale_traders_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

; 优先级 (数字越小越先启动，刷新任务优先级较低)
priority=210
