#sudo cp /www/ai-trading/deploy/supervisor/screen_leaderboard.conf /etc/supervisord.d/screen_leaderboard.ini
[program:screen_leaderboard]
; 排行榜交易者批量分析 Supervisor 配置
; 获取 Hyperliquid 排行榜前 N 名交易者，分析并保存到数据库

; 命令 - 使用 conda ai-trading 环境
; 参数说明: --limit 获取前N名, --workers 并发数, --proxy 启用代理, --delay API延迟
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/screen_leaderboard.py --limit 5000 --workers 1 --delay 1.5
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=false
autorestart=false
startsecs=30
startretries=1

; 停止配置
stopwaitsecs=60
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_screen_leaderboard.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile=/www/ai-trading/logs/supervisor_screen_leaderboard_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5

; 优先级 (数字越小越先启动，批量分析任务优先级较低)
priority=200
