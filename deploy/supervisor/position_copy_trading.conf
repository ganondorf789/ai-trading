#sudo cp /www/ai-trading/deploy/supervisor/position_copy_trading.conf /etc/supervisord.d/position_copy_trading.ini
[program:position_copy_trading]
; 仓位级别跟单机器人 Supervisor 配置
; 第二种跟单模式：跟单特定交易员的特定仓位

; 命令 - 使用 conda base 环境
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/examples/position_copy_trading_example.py
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

; 停止配置
stopwaitsecs=30
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_position_copy_trading.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/ai-trading/logs/supervisor_position_copy_trading_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 优先级 (数字越小越先启动，跟单服务在API之后启动)
priority=100
