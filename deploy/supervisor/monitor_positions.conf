#sudo cp /www/ai-trading/deploy/supervisor/monitor_positions.conf /etc/supervisord.d/monitor_positions.ini
[program:monitor_positions]
; S级交易员仓位监控 Supervisor 配置

; 命令 - 使用 conda base 环境
; --workers 10: 每批并发处理10个交易员
; --proxy: 启用代理
; --delay 1: 批次间延迟1秒
; --interval 5: 每5分钟循环一次
command=/root/miniconda3/envs/ai-trading/bin/python /www/ai-trading/monitor_s_traders_positions.py --workers 10 --proxy --delay 1 --interval 5
directory=/www/ai-trading
user=root

; 环境变量 - 从 .env 文件加载或直接配置
environment=PYTHONUNBUFFERED="1"

; 自动启动和重启
autostart=true
autorestart=true
startsecs=10
startretries=3

; 停止配置
stopwaitsecs=30
stopsignal=SIGTERM

; 日志配置
stdout_logfile=/www/ai-trading/logs/supervisor_monitor_positions.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/www/ai-trading/logs/supervisor_monitor_positions_error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; 优先级 (数字越小越先启动)
priority=110
